<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower of Life</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #2a2525;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            pointer-events: none;
            line-height: 1.6;
        }
        #mode {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="mode">Flower of Life</div>
    <div id="info">Drag to rotate • Scroll to zoom<br>Space/T: toggle pattern • S: sphere style</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuration
        const CONFIG = {
            // Shared
            backgroundColor: 0x2a2525,
            lineColor: 0xf5f5f0,

            // Flower of Life
            flowerRings: 3,
            circleRadius: 1.5,
            circleSegments: 64,
            pulseSpeed: 0.5,
            pulseAmount: 0.05,

            // Harmonic Waves
            numHarmonics: 16,
            waveSegments: 256,
            waveWidth: 10,
            verticalSpacing: 0.6,
            baseAmplitude: 1.0,
            waveAnimationSpeed: 0.3,

            // 3D Flower of Life (Spheres)
            sphere3dRings: 2,
            sphereRadius: 0.8,
            sphereSegments: 32,
            sphereLayers: 3,
            layerSpacing: 1.4,
            sphere3dRotationSpeed: 0.3
        };

        // Pattern state
        const PATTERNS = {
            FLOWER: 'flower',
            WAVES: 'waves',
            SPHERES: 'spheres'
        };
        let currentPattern = PATTERNS.FLOWER;

        // Sphere style state
        const SPHERE_STYLES = ['solid', 'wireframe', 'glass'];
        let currentSphereStyle = 0;

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.backgroundColor);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Groups for each pattern
        const flowerGroup = new THREE.Group();
        const wavesGroup = new THREE.Group();
        const spheresGroup = new THREE.Group();
        scene.add(flowerGroup);
        scene.add(wavesGroup);
        scene.add(spheresGroup);

        // Lighting for 3D spheres
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, -5, -5);
        scene.add(fillLight);

        // =====================
        // FLOWER OF LIFE
        // =====================

        // Generate hexagonal grid positions for Flower of Life
        function getFlowerPositions(rings, radius) {
            const positions = [];

            // Center circle
            positions.push({ x: 0, y: 0 });

            // For the Flower of Life, circles are placed at distance = radius
            // Using axial coordinates for hexagonal grid
            for (let ring = 1; ring <= rings; ring++) {
                // Each ring has 6 * ring circles
                for (let i = 0; i < 6; i++) {
                    const angle = (i * Math.PI) / 3; // 60 degree intervals

                    // Walk along the edge of the hexagon
                    for (let j = 0; j < ring; j++) {
                        const nextAngle = ((i + 2) * Math.PI) / 3;

                        // Start position for this edge
                        const startX = ring * radius * Math.cos(angle);
                        const startY = ring * radius * Math.sin(angle);

                        // Direction along edge
                        const dx = radius * Math.cos(nextAngle);
                        const dy = radius * Math.sin(nextAngle);

                        const x = startX + j * dx;
                        const y = startY + j * dy;

                        positions.push({ x, y });
                    }
                }
            }

            return positions;
        }

        // Create a single circle as a line
        function createCircle(centerX, centerY, radius, segments) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array((segments + 1) * 3);

            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                positions[i * 3] = centerX + radius * Math.cos(angle);
                positions[i * 3 + 1] = centerY + radius * Math.sin(angle);
                positions[i * 3 + 2] = 0;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: CONFIG.lineColor,
                transparent: true,
                opacity: 0.8
            });

            return new THREE.Line(geometry, material);
        }

        // Build the Flower of Life pattern
        function buildFlowerOfLife() {
            const positions = getFlowerPositions(CONFIG.flowerRings, CONFIG.circleRadius);

            for (const pos of positions) {
                const circle = createCircle(
                    pos.x,
                    pos.y,
                    CONFIG.circleRadius,
                    CONFIG.circleSegments
                );
                flowerGroup.add(circle);
            }
        }

        buildFlowerOfLife();

        // =====================
        // HARMONIC WAVES
        // =====================

        const waves = [];

        function createWave(harmonic) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.waveSegments * 3);

            updateWaveGeometry(positions, harmonic, 0);

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const opacity = 1.0 - (harmonic / CONFIG.numHarmonics) * 0.3;
            const material = new THREE.LineBasicMaterial({
                color: CONFIG.lineColor,
                transparent: true,
                opacity: opacity
            });

            const line = new THREE.Line(geometry, material);
            line.position.y = harmonic * CONFIG.verticalSpacing;

            return { line, geometry, positions, harmonic };
        }

        function updateWaveGeometry(positions, harmonic, time) {
            const amplitude = CONFIG.baseAmplitude / Math.sqrt(harmonic);

            for (let i = 0; i < CONFIG.waveSegments; i++) {
                const t = i / (CONFIG.waveSegments - 1);
                const x = (t - 0.5) * CONFIG.waveWidth;
                const phase = time * CONFIG.waveAnimationSpeed * harmonic;
                const z = amplitude * Math.sin(harmonic * t * Math.PI * 2 + phase);

                positions[i * 3] = x;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = z;
            }
        }

        // Build harmonic waves
        for (let h = 1; h <= CONFIG.numHarmonics; h++) {
            const wave = createWave(h);
            waves.push(wave);
            wavesGroup.add(wave.line);
        }

        // =====================
        // 3D FLOWER OF LIFE (SPHERES)
        // =====================

        // Generate 3D hexagonal close-packed positions
        function get3DFlowerPositions(rings, spacing, layers, layerSpacing) {
            const positions = [];

            for (let layer = 0; layer < layers; layer++) {
                const zOffset = layer * layerSpacing;
                // Alternate layers are offset for close-packing
                const layerPositions = getFlowerPositions(rings, spacing);

                for (const pos of layerPositions) {
                    positions.push({
                        x: pos.x + (layer % 2 === 1 ? spacing * 0.5 : 0),
                        y: pos.y + (layer % 2 === 1 ? spacing * Math.sqrt(3) / 6 : 0),
                        z: zOffset
                    });
                }
            }

            // Center vertically
            const centerZ = (layers - 1) * layerSpacing / 2;
            return positions.map(p => ({ ...p, z: p.z - centerZ }));
        }

        // Create a sphere with the specified style
        function createSphere(x, y, z, radius, style) {
            const geometry = new THREE.SphereGeometry(radius, CONFIG.sphereSegments, CONFIG.sphereSegments);
            let material;

            switch (style) {
                case 'wireframe':
                    material = new THREE.MeshBasicMaterial({
                        color: CONFIG.lineColor,
                        wireframe: true,
                        transparent: true,
                        opacity: 0.6
                    });
                    break;
                case 'glass':
                    material = new THREE.MeshPhysicalMaterial({
                        color: CONFIG.lineColor,
                        transparent: true,
                        opacity: 0.3,
                        roughness: 0.1,
                        metalness: 0.1,
                        transmission: 0.9,
                        thickness: 0.5
                    });
                    break;
                case 'solid':
                default:
                    material = new THREE.MeshStandardMaterial({
                        color: CONFIG.lineColor,
                        roughness: 0.4,
                        metalness: 0.2
                    });
            }

            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            return sphere;
        }

        // Build the 3D Flower of Life with spheres
        function build3DFlowerOfLife(style) {
            // Clear existing spheres
            while (spheresGroup.children.length > 0) {
                const child = spheresGroup.children[0];
                child.geometry.dispose();
                child.material.dispose();
                spheresGroup.remove(child);
            }

            const positions = get3DFlowerPositions(
                CONFIG.sphere3dRings,
                CONFIG.sphereRadius * 2,
                CONFIG.sphereLayers,
                CONFIG.layerSpacing
            );

            for (const pos of positions) {
                const sphere = createSphere(pos.x, pos.y, pos.z, CONFIG.sphereRadius, style);
                spheresGroup.add(sphere);
            }
        }

        build3DFlowerOfLife(SPHERE_STYLES[currentSphereStyle]);

        // =====================
        // PATTERN SWITCHING
        // =====================

        function setCamera(pattern) {
            if (pattern === PATTERNS.FLOWER) {
                camera.position.set(0, 0, 12);
                controls.target.set(0, 0, 0);
            } else if (pattern === PATTERNS.WAVES) {
                camera.position.set(8, 6, 12);
                controls.target.set(0, CONFIG.numHarmonics * CONFIG.verticalSpacing / 2, 0);
            } else if (pattern === PATTERNS.SPHERES) {
                camera.position.set(8, 6, 10);
                controls.target.set(0, 0, 0);
            }
            controls.update();
        }

        function switchPattern(pattern) {
            currentPattern = pattern;
            flowerGroup.visible = (pattern === PATTERNS.FLOWER);
            wavesGroup.visible = (pattern === PATTERNS.WAVES);
            spheresGroup.visible = (pattern === PATTERNS.SPHERES);

            const modeNames = {
                [PATTERNS.FLOWER]: 'Flower of Life',
                [PATTERNS.WAVES]: 'Harmonic Waves',
                [PATTERNS.SPHERES]: `3D Flower (${SPHERE_STYLES[currentSphereStyle]})`
            };
            document.getElementById('mode').textContent = modeNames[pattern];

            setCamera(pattern);
        }

        // Initialize
        switchPattern(PATTERNS.FLOWER);

        // Keyboard toggle
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'KeyT') {
                e.preventDefault();
                // Cycle: FLOWER -> WAVES -> SPHERES -> FLOWER
                const patterns = [PATTERNS.FLOWER, PATTERNS.WAVES, PATTERNS.SPHERES];
                const currentIndex = patterns.indexOf(currentPattern);
                const newPattern = patterns[(currentIndex + 1) % patterns.length];
                switchPattern(newPattern);
            }

            // 'S' to cycle sphere styles when in spheres mode
            if (e.code === 'KeyS' && currentPattern === PATTERNS.SPHERES) {
                e.preventDefault();
                currentSphereStyle = (currentSphereStyle + 1) % SPHERE_STYLES.length;
                build3DFlowerOfLife(SPHERE_STYLES[currentSphereStyle]);
                document.getElementById('mode').textContent =
                    `3D Flower (${SPHERE_STYLES[currentSphereStyle]})`;
            }
        });

        // =====================
        // RESIZE HANDLER
        // =====================

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =====================
        // ANIMATION LOOP
        // =====================

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Animate Flower of Life - breathing pulse
            if (currentPattern === PATTERNS.FLOWER) {
                const pulseScale = 1 + Math.sin(time * CONFIG.pulseSpeed) * CONFIG.pulseAmount;
                flowerGroup.scale.set(pulseScale, pulseScale, 1);
            }

            // Animate Harmonic Waves
            if (currentPattern === PATTERNS.WAVES) {
                for (const wave of waves) {
                    updateWaveGeometry(wave.positions, wave.harmonic, time);
                    wave.geometry.attributes.position.needsUpdate = true;
                }
            }

            // Animate 3D Spheres - slow rotation
            if (currentPattern === PATTERNS.SPHERES) {
                spheresGroup.rotation.y = time * CONFIG.sphere3dRotationSpeed * 0.5;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
