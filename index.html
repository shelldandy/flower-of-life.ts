<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower of Life - Harmonic Waves</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #2a2525;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate • Scroll to zoom • View from above for Flower of Life</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuration
        const CONFIG = {
            numHarmonics: 16,
            waveSegments: 256,
            waveWidth: 10,
            verticalSpacing: 0.6,
            baseAmplitude: 1.0,
            animationSpeed: 0.3,
            backgroundColor: 0x2a2525,
            lineColor: 0xf5f5f0
        };

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.backgroundColor);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(8, 6, 12);
        camera.lookAt(0, CONFIG.numHarmonics * CONFIG.verticalSpacing / 2, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, CONFIG.numHarmonics * CONFIG.verticalSpacing / 2, 0);
        controls.update();

        // Store wave data for animation
        const waves = [];

        // Create a single harmonic wave
        function createWave(harmonic) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(CONFIG.waveSegments * 3);

            // Initial positions
            updateWaveGeometry(positions, harmonic, 0);

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Line material with slight opacity variation based on harmonic
            const opacity = 1.0 - (harmonic / CONFIG.numHarmonics) * 0.3;
            const material = new THREE.LineBasicMaterial({
                color: CONFIG.lineColor,
                transparent: true,
                opacity: opacity
            });

            const line = new THREE.Line(geometry, material);

            // Position vertically based on harmonic number
            line.position.y = harmonic * CONFIG.verticalSpacing;

            return { line, geometry, positions, harmonic };
        }

        // Update wave geometry for animation
        function updateWaveGeometry(positions, harmonic, time) {
            const amplitude = CONFIG.baseAmplitude / Math.sqrt(harmonic);

            for (let i = 0; i < CONFIG.waveSegments; i++) {
                const t = i / (CONFIG.waveSegments - 1);
                const x = (t - 0.5) * CONFIG.waveWidth;

                // Wave equation with phase animation
                // Higher harmonics move faster (multiply time by harmonic)
                const phase = time * CONFIG.animationSpeed * harmonic;
                const z = amplitude * Math.sin(harmonic * t * Math.PI * 2 + phase);

                positions[i * 3] = x;
                positions[i * 3 + 1] = 0;
                positions[i * 3 + 2] = z;
            }
        }

        // Create all harmonic waves
        for (let h = 1; h <= CONFIG.numHarmonics; h++) {
            const wave = createWave(h);
            waves.push(wave);
            scene.add(wave.line);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Update each wave
            for (const wave of waves) {
                updateWaveGeometry(wave.positions, wave.harmonic, time);
                wave.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
